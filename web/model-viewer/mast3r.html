<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;background:#111b23;color:#ecf2f6;font:15px/1.6 system-ui,sans-serif}header{position:absolute;z-index:2;top:20px;left:24px;max-width:460px;background:#172631ed;padding:18px 22px;border:1px solid #344958;border-radius:12px}h1{font-size:22px;margin:0 0 5px}p{margin:5px 0;color:#adbec9}button,a{font:inherit;color:#d6f4ee;background:#263e4d;border:1px solid #48616e;border-radius:7px;padding:6px 12px;cursor:pointer;text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}label{margin-right:12px}#status{color:#89dfc9}footer{position:absolute;bottom:12px;left:24px;color:#adbec9;pointer-events:none}canvas{display:block;width:100vw;height:100vh}input[type=range]{width:105px;vertical-align:middle}@media(max-width:600px){header{top:10px;left:10px;right:10px;padding:12px}h1{font-size:18px}}
